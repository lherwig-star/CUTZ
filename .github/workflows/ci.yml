# ─────────────────────────────────────────────────────────────
#  CUTZ — Automatischer Build- und Test-Lauf
#
#  Bei jedem Push leiht GitHub uns kurz einen echten Mac, baut dort
#  die App und lässt die Tests laufen. Das Ergebnis steht danach im
#  Tab "Actions" auf GitHub: grüner Haken oder rotes Kreuz.
#
#  Warum? Lukas entwickelt unter Windows und hat keinen Mac. So sieht
#  er trotzdem sofort, ob sein Code kompiliert und die Tests grün sind.
#  Was der Lauf NICHT ersetzt: die App wirklich anzuschauen und zu
#  bedienen — das passiert weiterhin auf Finns Mac im Simulator.
# ─────────────────────────────────────────────────────────────

name: Build & Tests

on:
  push:
    branches: ["**"]        # jeder Branch, damit Lukas immer Rückmeldung bekommt
  pull_request:
    branches: [main]
  workflow_dispatch: {}     # erlaubt das Starten von Hand im Actions-Tab

# Läuft für denselben Branch schon ein älterer Durchgang, wird der
# abgebrochen. Spart Wartezeit und Minuten, wenn man mehrmals hintereinander
# pusht.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Bauen und testen
    # macOS ist Pflicht: Xcode gibt es nur dort.
    #
    # Bewusst "macos-latest" statt einer festen Nummer: GitHub mustert alte
    # Rechner-Images irgendwann aus. Fragt man dann eine Version an, die es
    # nicht mehr gibt, wartet der Job endlos und wird nach 15 Minuten
    # kommentarlos abgebrochen — ein Fehler, den man kaum als solchen erkennt.
    runs-on: macos-latest
    # Vorübergehend höher, solange die Übersetzungszeit untersucht wird.
    timeout-minutes: 45

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Xcode 16 auswählen
        run: |
          # Auf den GitHub-Macs liegen mehrere Xcode-Versionen nebeneinander.
          # Wir nehmen die neueste 16er, passend zum README.
          echo "Vorhandene Xcode-Versionen:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (keine gefunden)"

          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          else
            echo "::warning::Kein Xcode 16 vorhanden — nehme die Standardversion. \
          Wenn der Build gleich an Swift- oder SDK-Fehlern scheitert, liegt es vermutlich daran."
          fi
          xcodebuild -version

      - name: Werkzeuge installieren
        # xcodegen erzeugt das Projekt, xcbeautify macht aus der sehr
        # geschwätzigen Ausgabe von xcodebuild etwas Lesbares.
        run: brew install xcodegen xcbeautify

      - name: CUTZ.xcodeproj erzeugen
        # Genau dasselbe Skript, das Finn lokal aufruft. Dadurch testen wir
        # nebenbei mit, dass project.yml und setup.sh in Ordnung sind.
        run: ./scripts/setup.sh

      - name: Simulator aussuchen
        id: sim
        run: |
          # Bevorzugt das iPhone 16 (so steht es im README). Falls GitHub
          # dieses Modell irgendwann nicht mehr bereitstellt, nehmen wir
          # einfach ein anderes verfügbares iPhone, statt rot zu laufen.
          if xcrun simctl list devices available | grep -q "iPhone 16 ("; then
            SIM="iPhone 16"
          else
            SIM=$(xcrun simctl list devices available \
              | grep -oE "iPhone [0-9]+[^(]*" | tail -1 | sed 's/ *$//')
          fi
          if [ -z "$SIM" ]; then
            echo "::error::Kein iPhone-Simulator verfügbar."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Verwende Simulator: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      - name: Bauen und Tests laufen lassen
        run: |
          set -o pipefail
          # CODE_SIGNING_ALLOWED=NO: Im Simulator braucht es keine
          # Entwickler-Signatur — und GitHub hat auch keine.
          # derivedDataPath: legt die Bauergebnisse an einen bekannten Ort,
          # damit der nächste Schritt die Testprotokolle findet.
          # OTHER_SWIFT_FLAGS: DIAGNOSE, vorübergehend.
          # Der Compiler meldet jeden Ausdruck und jeden Funktionskörper,
          # der länger als 300 ms zum Typprüfen braucht — mit Datei und
          # Zeile. So sieht man, welche View die Bauzeit hochtreibt,
          # statt es zu erraten.
          xcodebuild test \
            -project CUTZ.xcodeproj \
            -scheme CUTZ \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=300 -Xfrontend -warn-long-function-bodies=300' \
            2>&1 | tee build.log | xcbeautify

      - name: Langsame Ausdrücke auflisten
        # Läuft auch bei rotem Build — gerade dann ist die Liste nützlich.
        if: always()
        shell: bash
        run: |
          echo "▸ Ausdrücke über 300 ms:"
          if [ -f build.log ]; then
              grep "to type-check" build.log \
                | sed 's|.*/CUTZ/||' \
                | sort -u \
                | head -40
              echo ""
              echo "Gesamtzahl: $(grep -c 'to type-check' build.log || true)"
          else
              echo "  (keine build.log gefunden)"
          fi

      - name: Testprotokolle sichern
        # Läuft auch, wenn der Schritt davor rot war — gerade dann sind
        # die Protokolle ja interessant. Finn kann sie herunterladen und
        # in Xcode öffnen.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testprotokolle
          path: build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
